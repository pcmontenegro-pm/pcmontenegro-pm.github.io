<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="How to work with Pablo Montenegro: payment product strategy, operational redesign, and fractional product leadership for fintech teams across Europe and Latin America.">
<meta property="og:type" content="website">
<meta property="og:title" content="Consulting & Engagements — Pablo Montenegro">
<meta property="og:description" content="Three ways to work together: Discovery Sprint, Operational Redesign, and Fractional Product Leadership — for payments, collections and fintech products.">
<meta property="og:url" content="https://pablomontenegro.ie/consulting.html">
<meta property="og:image" content="https://pablomontenegro.ie/assets/pablo-photo.webp">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://pablomontenegro.ie/consulting.html">
<title>Consulting & Engagements — Pablo Montenegro | Payments & Fintech Product Strategy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══ TOKENS ═══════════════════════════════════════ */
:root {
  --navy:   #0A1226; --navy2: #0F1B33; --navy3: #162240;
  --gold:   #C4A05A; --gold2: #DDB870; --gold3: #F0DFB8;
  --ivory:  #C8B89A; --ivory2: #DDD0B8;
  --cream:  #FAF7F2; --white: #FFF;
  --muted:  #7A8599; --muted2: #5A6478;
  --green:  #2A7A5A; --green2: #35A070; --red: #C04040;
  --border: rgba(196,160,90,.14); --border2: rgba(255,255,255,.06);
  --serif: 'Cormorant Garamond',Georgia,serif;
  --sans:  'DM Sans',sans-serif;
  --mono:  'DM Mono',monospace;
  --max-w: 1160px;
}

/* ══ RESET ════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;font-size:17px;}
body{background:var(--navy);color:var(--cream);font-family:var(--sans);
  line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
img{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
button{cursor:pointer;font-family:var(--sans);}
strong{font-weight:500;}

/* Grain */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  opacity:.018;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px;}
body>*{position:relative;z-index:1;}

/* ══ NAV ══════════════════════════════════════════ */
.site-nav{
  position:sticky;top:0;z-index:200;
  padding:0 48px;height:56px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(10,18,38,.96);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border2);
}
.nav-brand{display:flex;align-items:center;gap:8px;transition:opacity .2s;}
.nav-brand:hover{opacity:.75;}
.nav-brand img{width:22px;height:22px;border-radius:50%;object-fit:cover;}
.nav-brand-name{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--gold);}
.nav-links{display:flex;align-items:center;gap:24px;}
.nav-link{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--muted);transition:color .2s;}
.nav-link.active{color:var(--gold);}
.nav-link:hover{color:var(--gold);}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-burger{display:none;flex-direction:column;justify-content:center;gap:4px;width:28px;height:28px;background:none;border:none;cursor:pointer;padding:0;}
.nav-burger span{display:block;width:100%;height:1.5px;background:var(--cream);transition:transform .2s,opacity .2s;}
.nav-burger.open span:nth-child(1){transform:translateY(5.5px) rotate(45deg);}
.nav-burger.open span:nth-child(2){opacity:0;}
.nav-burger.open span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg);}
.nav-lang{display:flex;border:1px solid var(--border);border-radius:2px;overflow:hidden;}
.lang-btn{padding:3px 9px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  background:transparent;border:none;color:var(--muted);cursor:pointer;transition:all .15s;}
.lang-btn.active{background:var(--gold);color:var(--navy);font-weight:500;}
.nav-cv{font-family:var(--mono);font-size:10px;letter-spacing:.06em;white-space:nowrap;
  padding:4px 12px;border:1px solid var(--border);color:var(--gold3);border-radius:2px;transition:all .2s;}
.nav-cv:hover{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.nav-cta{font-size:11.5px;padding:5px 14px;background:var(--gold);color:var(--navy);white-space:nowrap;
  border-radius:2px;font-weight:500;transition:all .2s;}
.nav-cta:hover{background:var(--gold2);}

/* ══ SHARED ═══════════════════════════════════════ */
section{padding:80px 48px;}
.si{max-width:var(--max-w);margin:0 auto;}
.sec-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--gold);
  text-transform:uppercase;display:block;margin-bottom:8px;}
.sec-h2{font-family:var(--serif);font-size:clamp(28px,3.5vw,44px);
  font-weight:300;color:var(--white);line-height:1.12;margin-bottom:24px;}
.sec-h2 em{font-style:italic;color:var(--gold2);}
.sec-sub{font-size:15px;color:var(--muted);line-height:1.7;max-width:560px;}
.btn-gold{display:inline-block;padding:11px 26px;background:var(--gold);color:var(--navy);
  font-size:14px;font-weight:500;border-radius:2px;transition:all .2s;}
.btn-gold:hover{background:var(--gold2);transform:translateY(-1px);}
.btn-outline{display:inline-block;padding:10px 22px;border:1px solid var(--border);color:var(--cream);
  font-size:14px;border-radius:2px;transition:all .2s;}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);}

/* ══ HERO ══════════════════════════════════════════ */
.hero-section{
  padding:72px 48px 0;min-height:calc(100vh - 56px);
  display:flex;flex-direction:column;border-bottom:1px solid var(--border2);
}
.hero-bg{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 72% 28%,rgba(196,160,90,.07) 0%,transparent 50%),
    radial-gradient(ellipse at 10% 80%,rgba(42,122,90,.06) 0%,transparent 45%);}
.hero-inner{max-width:var(--max-w);margin:0 auto;width:100%;
  display:grid;grid-template-columns:1fr 340px;gap:56px;align-items:center;
  flex:1;padding-bottom:56px;position:relative;z-index:1;}

/* Hero left */
.hero-kicker{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.hero-kicker-dot{width:6px;height:6px;border-radius:50%;background:var(--gold2);}
.hero-kicker-text{font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  color:var(--green2);text-transform:uppercase;}
.hero-h1{font-family:var(--serif);font-size:clamp(36px,5vw,64px);
  font-weight:300;line-height:1.08;color:var(--white);margin-bottom:6px;}
.hero-h1-sub{font-family:var(--serif);font-size:clamp(22px,3vw,36px);
  font-weight:300;font-style:italic;color:var(--gold2);margin-bottom:20px;line-height:1.2;}
.hero-summary{font-size:16px;color:var(--muted);line-height:1.75;
  max-width:480px;margin-bottom:28px;}
.hero-ctas{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.hero-avail{display:flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--muted2);}
.hero-avail-dot{width:5px;height:5px;border-radius:50%;background:var(--gold2);}

/* Hero right — photo + metrics */
.hero-visual{display:flex;flex-direction:column;gap:16px;align-items:center;}
.hero-photo-wrap{position:relative;width:100%;max-width:280px;}
.hero-photo{width:100%;max-width:280px;height:320px;object-fit:cover;object-position:center top;border-radius:2px;
  filter:grayscale(8%);border:1px solid var(--border);display:block;margin:0 auto;}
.hero-seal{position:absolute;bottom:-16px;right:-16px;width:64px;height:64px;
  opacity:.5;animation:rotateSeal 22s linear infinite;}
@keyframes rotateSeal{to{transform:rotate(360deg);}}
.hero-metrics{display:grid;grid-template-columns:1fr 1fr;gap:1px;
  background:var(--border);border:1px solid var(--border);}
.metric{background:var(--navy);padding:14px 16px;}
.metric-num{font-family:var(--serif);font-size:26px;font-weight:300;
  color:var(--gold);line-height:1;display:block;margin-bottom:3px;}
.metric-label{font-size:11.5px;color:var(--muted);line-height:1.35;}

/* Hero companies bar */
.hero-bar{max-width:var(--max-w);margin:0 auto;width:100%;
  padding:18px 0;border-top:1px solid var(--border2);
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:relative;z-index:1;}
.bar-label{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;
  color:var(--muted2);text-transform:uppercase;flex-shrink:0;}
.bar-items{display:flex;gap:8px;flex-wrap:wrap;}
.bar-pill{display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--muted);padding:3px 10px;
  border:1px solid var(--border);border-radius:20px;}
.bar-pill-icon{font-size:11px;display:inline-flex;align-items:center;color:var(--muted);}

/* ══ SERVICES / HOW I HELP ══════════════════════════ */
#services{background:linear-gradient(180deg,#0d1830 0%,#0A1226 100%);border-top:1px solid var(--border2);}
.pillars-grid{display:grid;grid-template-columns:repeat(3,1fr);
  gap:1px;background:var(--border);border:1px solid var(--border);margin-top:36px;}
.pillar-card{background:var(--navy);padding:28px 24px;display:flex;flex-direction:column;
  transition:background .18s;}
.pillar-card:hover{background:var(--navy2);}
.pillar-num{font-family:var(--serif);font-size:13px;color:var(--gold);
  letter-spacing:.04em;margin-bottom:14px;display:block;}
.pillar-title{font-family:var(--serif);font-size:19px;font-weight:400;
  color:var(--white);line-height:1.28;margin-bottom:12px;}
.pillar-desc{font-size:13.5px;color:var(--muted);line-height:1.7;margin-bottom:14px;}
.pillar-proof{font-size:12.5px;color:rgba(250,247,242,.65);line-height:1.65;
  padding-top:14px;border-top:1px solid var(--border2);margin-bottom:16px;flex:1;}
.pillar-link{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  color:var(--gold);border:1px solid var(--border);padding:6px 14px;
  border-radius:2px;transition:all .2s;align-self:flex-start;margin-top:auto;}
.pillar-link:hover{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.services-cta-row{margin-top:36px;text-align:center;}

/* ══ ENGAGEMENTS / WAYS TO WORK ══════════════════════ */
#engagements{background:#0A1226;border-top:1px solid var(--border2);}
.eng-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--border);border:1px solid var(--border);margin-top:36px;}
.eng-card{background:var(--navy2);padding:30px 26px;display:flex;flex-direction:column;
  transition:background .18s,transform .18s;}
.eng-card:hover{background:var(--navy3);transform:translateY(-2px);}
.eng-card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
.eng-num{font-family:var(--serif);font-size:36px;font-weight:300;color:rgba(196,160,90,.35);letter-spacing:.02em;line-height:1;}
.eng-duration{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--green2);
  text-transform:uppercase;border:1px solid rgba(53,160,112,.3);padding:3px 9px;border-radius:20px;margin-top:4px;}
.eng-name{font-family:var(--serif);font-size:21px;font-weight:400;color:var(--white);
  line-height:1.25;margin-bottom:10px;}
.eng-for{font-size:13.5px;color:var(--gold2);line-height:1.6;margin-bottom:18px;font-style:italic;}
.eng-list{list-style:none;margin-bottom:18px;flex:1;}
.eng-item{font-size:13px;color:var(--muted);line-height:1.6;padding-left:16px;
  position:relative;margin-bottom:8px;}
.eng-item::before{content:'—';position:absolute;left:0;color:var(--gold);}
.eng-proof{font-size:12px;color:rgba(250,247,242,.6);line-height:1.6;
  padding-top:14px;border-top:1px solid var(--border2);}
.eng-note{font-size:12.5px;color:var(--muted2);text-align:center;margin-top:24px;
  font-style:italic;max-width:560px;margin-left:auto;margin-right:auto;}

/* ══ WORK ══════════════════════════════════════════ */
#work{background:linear-gradient(180deg,#0A1226 0%,#0d1830 100%);padding:72px 48px;}
.work-header{display:flex;align-items:flex-end;justify-content:space-between;
  margin-bottom:28px;flex-wrap:wrap;gap:16px;}
.work-tabs{display:flex;gap:0;background:var(--border);
  border:1px solid var(--border);overflow:hidden;margin-bottom:0;}
.work-tab{flex:1;padding:14px 20px;background:var(--navy2);border:none;
  display:flex;align-items:center;gap:12px;transition:background .2s;text-align:left;}
.work-tab.active{background:var(--navy);border-bottom:3px solid var(--gold);}
.work-tab:hover:not(.active){background:var(--navy3);}
.tab-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.consulting-dot{background:var(--gold);}
.itau-dot{background:#3A82C4;}
.tab-label{display:flex;flex-direction:column;gap:1px;}
.tab-label strong{font-size:13px;font-weight:500;color:var(--white);}
.work-tab.active .tab-label strong{color:var(--gold);}
.tab-label small{font-size:10px;color:var(--muted);font-weight:400;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.tab-panel.hidden{display:none;}
.tab-intro{display:flex;align-items:center;gap:14px;
  padding:16px 20px;background:rgba(196,160,90,.04);
  border:1px solid var(--border);border-bottom:none;
  font-size:14.5px;color:var(--muted);}
.tab-intro-icon{font-size:18px;flex-shrink:0;}

/* Cases grid */
.cases-grid{display:grid;grid-template-columns:repeat(3,1fr);
  gap:1px;background:var(--border);border:1px solid var(--border);margin-top:0;}

/* Last card alone — centered column, empty cells match navy */
.cases-grid .cc:last-child:nth-child(3n+1) {
  grid-column: 2 / 3;
}
.cases-grid:has(.cc:last-child:nth-child(3n+1))::before {
  content: ''; background: var(--navy); grid-column: 1; grid-row: 2;
}
.cases-grid:has(.cc:last-child:nth-child(3n+1))::after {
  content: ''; background: var(--navy); grid-column: 3; grid-row: 2;
}
.cases-grid .cc:last-child:nth-child(3n+2) {
  grid-column: 2 / span 2;
}

.cc{background:var(--navy);transition:background .18s;display:flex;flex-direction:column;}
.cc:hover{background:var(--navy2);}
.case-vis-bg{width:100%;aspect-ratio:16/9;display:flex;align-items:center;
  justify-content:center;position:relative;overflow:hidden;min-height:130px;}
.case-num{position:absolute;top:10px;right:14px;font-family:var(--serif);
  font-size:2.8rem;font-weight:300;color:rgba(196,160,90,.22);line-height:1;pointer-events:none;}
.cc-body{padding:18px 20px;flex:1;display:flex;flex-direction:column;}
.cc-tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--gold);
  text-transform:uppercase;display:block;margin-bottom:8px;}
.cc-tag--advisory{color:var(--ivory);}
.cc-title{font-family:var(--serif);font-size:20px;font-weight:400;
  color:var(--white);line-height:1.25;margin-bottom:8px;}
.cc-title em{font-style:italic;color:var(--gold2);}
.cc-desc{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.eu-note{display:block;font-family:var(--mono);font-size:8.5px;
  color:var(--muted2);margin-bottom:12px;}
.cc-metrics{display:flex;gap:16px;margin-bottom:14px;
  padding-top:12px;border-top:1px solid var(--border2);}
.oc{display:flex;flex-direction:column;gap:2px;}
.oc-n{font-family:var(--serif);font-size:20px;font-weight:300;color:var(--gold);line-height:1;}
.oc-l{font-size:9.5px;color:var(--muted);}
.cc-spacer{flex:1;}
.case-cta{display:inline-flex;align-items:center;gap:4px;margin-top:auto;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  color:var(--gold);border:1px solid var(--border);padding:4px 12px;border-radius:2px;transition:all .2s;}
.case-cta:hover{background:var(--gold);color:var(--navy);border-color:var(--gold);}

/* ══ ABOUT ══════════════════════════════════════════ */
#about{background:linear-gradient(180deg,#0e1a2e 0%,#0f1c30 100%);border-top:1px solid var(--border);}

/* Spec strips — scannable facts */
.spec-strip{display:grid;grid-template-columns:repeat(4,1fr);
  gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:48px;}
.spec-item{background:var(--navy);padding:18px 20px;display:flex;gap:14px;align-items:flex-start;}
.spec-icon{font-size:20px;flex-shrink:0;margin-top:2px;}
.spec-label{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;
  color:var(--gold);text-transform:uppercase;margin-bottom:4px;}
.spec-val{font-size:14px;color:var(--cream);line-height:1.4;}
.spec-sub{font-size:11px;color:var(--muted);margin-top:2px;}

.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start;}
.about-body{font-size:15.5px;color:rgba(250,247,242,.78);line-height:1.82;}
.about-body p+p{margin-top:16px;}
.about-body strong{color:var(--cream);}

/* Recs */
.recs-header{margin-bottom:20px;}
.recs-h3{font-family:var(--serif);font-size:clamp(20px,2.5vw,28px);font-weight:300;
  color:var(--white);line-height:1.2;margin-bottom:4px;}
.recs-h3 em{font-style:italic;color:var(--gold2);}
.recs-sub{font-size:12px;color:var(--muted);}
.recs-grid{display:flex;flex-direction:column;gap:10px;}
.rec-card{background:var(--navy);border:1px solid var(--border);
  padding:16px 18px;border-radius:2px;transition:border-color .2s;}
.rec-card:hover{border-color:rgba(196,160,90,.3);}
.rec-quote{font-family:var(--serif);font-size:16.5px;font-style:italic;
  color:var(--cream);line-height:1.5;margin-bottom:8px;}
.rec-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px;}
.rec-name{font-size:12px;font-weight:500;color:var(--cream);}
.rec-role{font-size:11px;color:var(--muted);}
.rec-link{font-family:var(--mono);font-size:9px;color:var(--gold);
  opacity:.7;transition:opacity .2s;}
.rec-link:hover{opacity:1;}

/* ══ BACKGROUND (EXP + SKILLS) ══════════════════════ */
#background{background:linear-gradient(180deg,#0A1226 0%,#0c1528 100%);border-top:1px solid var(--border);}
.bg-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;}

/* Exp timeline */
.exp-list{display:flex;flex-direction:column;gap:0;}
.exp-item{padding:20px 0;border-bottom:1px solid var(--border2);
  display:grid;grid-template-columns:120px 1fr;gap:20px;}
.exp-item:last-child{border-bottom:none;}
.exp-meta{display:flex;flex-direction:column;gap:3px;}
.exp-years{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--gold);}
.exp-company{font-size:12.5px;font-weight:500;color:var(--cream);}
.exp-loc{font-size:10.5px;color:var(--muted);}
.exp-role{font-size:14px;color:var(--white);margin-bottom:8px;font-weight:400;}
.exp-bullets{list-style:none;display:flex;flex-direction:column;gap:5px;}
.exp-bullets li{font-size:13.5px;color:var(--muted);line-height:1.65;
  padding-left:12px;position:relative;}
.exp-bullets li::before{content:'–';position:absolute;left:0;color:var(--gold);}
.exp-bullets li strong{color:var(--cream);}

/* Skills chips */
.skills-cols{display:flex;flex-direction:column;gap:18px;margin-bottom:36px;}
.skill-group{}
.skill-cat{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.skill-cat-icon{font-size:13px;}
.skill-cat-label{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;
  color:var(--gold);text-transform:uppercase;}
.skill-chips{display:flex;flex-wrap:wrap;gap:5px;}
.skill-chip{font-size:13px;color:var(--cream);
  padding:3px 10px;border:1px solid var(--border);border-radius:20px;
  transition:border-color .2s;}
.skill-chip:hover{border-color:rgba(196,160,90,.4);}

/* Education compact */
.edu-list{display:flex;flex-direction:column;gap:0;}
.edu-item{display:flex;gap:14px;padding:10px 0;
  border-bottom:1px solid var(--border2);}
.edu-item:last-child{border-bottom:none;}
.edu-year{font-family:var(--mono);font-size:10px;color:var(--gold);
  flex-shrink:0;min-width:36px;padding-top:1px;}
.edu-degree{font-size:14px;font-weight:500;color:var(--cream);margin-bottom:1px;}
.edu-school{font-size:12.5px;color:var(--muted);}

/* ══ PRODUCTS ══════════════════════════════════════ */
#products{background:linear-gradient(180deg,#10182a 0%,#131a26 100%);border-top:1px solid rgba(196,160,90,.12);}
.prods-grid{display:grid;grid-template-columns:repeat(4,1fr);
  gap:1px;background:var(--border);border:1px solid var(--border);}
.prod-card{background:var(--navy);display:flex;flex-direction:column;transition:background .2s;}
.prod-card:hover{background:var(--navy2);}
.prod-banner{height:80px;display:flex;align-items:center;justify-content:center;font-size:32px;border-bottom:1px solid var(--border);background:rgba(196,160,90,.04);}
.prod-body{padding:12px 20px 20px;flex:1;display:flex;flex-direction:column;}
.prod-type{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--gold);
  text-transform:uppercase;margin-bottom:6px;}
.prod-title{font-size:15.5px;font-weight:500;color:var(--white);margin-bottom:6px;line-height:1.3;}
.prod-desc{font-size:13.5px;color:var(--muted);line-height:1.65;flex:1;margin-bottom:14px;}
.prod-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;}
.prod-price{font-family:var(--serif);font-size:20px;color:var(--gold);font-weight:300;}
.prod-price small{font-size:10px;color:var(--muted);font-family:var(--sans);font-weight:400;}
.prod-cta{font-family:var(--mono);font-size:9px;letter-spacing:.06em;
  color:var(--gold);border:1px solid var(--border);padding:4px 10px;border-radius:2px;transition:all .2s;}
.prod-cta:hover{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.prod-soon{font-family:var(--mono);font-size:9px;color:var(--muted);
  border:1px dashed var(--border);padding:4px 10px;border-radius:2px;}

/* ══ WRITING ═══════════════════════════════════════ */
#writing{background:linear-gradient(180deg,#0c1828 0%,#0a1520 100%);border-top:1px solid var(--border);}
.writing-grid{display:grid;grid-template-columns:1fr 1fr;
  gap:1px;background:var(--border);border:1px solid var(--border);}
.writing-card{background:var(--navy);padding:24px 26px;
  display:flex;flex-direction:column;gap:8px;transition:background .2s;}
.writing-card:hover{background:var(--navy2);}
.writing-icon{font-size:22px;}
.writing-meta{display:flex;justify-content:space-between;align-items:center;}
.writing-type{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;
  color:var(--gold);text-transform:uppercase;}
.writing-year{font-family:var(--mono);font-size:10px;color:var(--muted);}
.writing-title{font-size:17px;font-weight:500;color:var(--white);line-height:1.35;}
.writing-desc{font-size:14px;color:var(--muted);line-height:1.65;flex:1;}
.writing-cta{font-family:var(--mono);font-size:9px;color:var(--gold);
  margin-top:auto;display:flex;align-items:center;gap:4px;}

/* ══ CONTACT ═══════════════════════════════════════ */
#contact{background:linear-gradient(180deg,#0f1c2e 0%,#121820 100%);border-top:1px solid rgba(196,160,90,.14);}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start;}
.contact-grid-solo{grid-template-columns:1fr;max-width:640px;margin:0 auto;}
.about-interests-wrap{margin-top:48px;padding-top:32px;border-top:1px solid var(--border2);max-width:520px;}
/* contact-sig handled by sig-wrap */
.contact-h2{font-family:var(--serif);font-size:clamp(24px,3vw,36px);
  font-weight:300;color:var(--white);line-height:1.2;margin-bottom:10px;}
.contact-h2 em{font-style:italic;color:var(--gold2);}
.contact-sub{font-size:15.5px;color:var(--muted);max-width:440px;line-height:1.75;margin-bottom:8px;}
.contact-detail{font-size:14px;color:var(--muted2);max-width:440px;
  line-height:1.65;margin-bottom:28px;}
.contact-detail strong{color:var(--cream);}
.contact-links{display:flex;flex-direction:column;gap:10px;}
.contact-link-btn{display:flex;align-items:center;gap:14px;
  padding:12px 16px;border:1px solid var(--border);border-radius:2px;transition:all .2s;}
.contact-link-btn:hover{border-color:rgba(196,160,90,.35);background:rgba(196,160,90,.03);}
.clb-icon{font-size:18px;width:26px;text-align:center;flex-shrink:0;}
.clb-label{font-size:13px;color:var(--cream);}
.clb-type{font-family:var(--mono);font-size:8.5px;color:var(--muted);
  letter-spacing:.06em;display:block;text-transform:uppercase;}
.clb-val{font-size:13.5px;color:var(--cream);}

/* Interests — compact */
.interests-h3{font-size:18px;font-weight:500;color:var(--white);margin-bottom:16px;}
.interests-list{display:flex;flex-direction:column;gap:14px;}
.interest-item{display:flex;gap:12px;align-items:flex-start;}
.interest-icon{font-size:18px;flex-shrink:0;margin-top:1px;}
.interest-body{}
.interest-title{font-size:14.5px;font-weight:500;color:var(--cream);margin-bottom:3px;}
.interest-desc{font-size:13.5px;color:var(--muted);line-height:1.6;}

/* ══ FOOTER ════════════════════════════════════════ */
.site-footer{padding:20px 48px;border-top:1px solid var(--border2);
  display:flex;justify-content:space-between;align-items:center;}
.footer-brand{display:flex;align-items:center;gap:8px;}
.footer-brand img{width:18px;height:18px;border-radius:50%;object-fit:cover;}
.footer-brand span{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);}
.footer-right{font-family:var(--mono);font-size:11px;color:var(--muted2);}


/* ── FIRMA INTEGRADA ────────────────────── */
.sig-wrap{
  margin-bottom:28px;
  /* Sin border, sin background — se integra con la página */
}
.contact-sig{
  width:100%;
  max-width:180px;
  opacity:.92;
  display:block;
  /* SVG con fondo transparente real — sin necesidad de blend mode */
}
/* ── SVG CUSTOM ICONS ──────────────────── */
.ico{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.ico svg{display:block;}
/* ── VISIT COUNTER ─────────────────────── */
.footer-counter{
  display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:11px;color:var(--muted2);
}
.counter-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--green2);animation:pulse 2.5s infinite;flex-shrink:0;
}
.counter-num{
  font-size:13px;font-weight:500;color:var(--cream);
  font-family:var(--mono);letter-spacing:.04em;
}

/* ══ ANIMATIONS ════════════════════════════════════ */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.reveal-up{animation:fadeUp .5s ease both;}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease;}
.reveal.visible{opacity:1;transform:translateY(0);}

/* ══ RESPONSIVE ════════════════════════════════════ */
@media(max-width:960px){
  .cases-grid{grid-template-columns:repeat(2,1fr);}
  .pillars-grid{grid-template-columns:1fr;}
  .eng-grid{grid-template-columns:1fr;}
  .prods-grid{grid-template-columns:repeat(2,1fr);}
  section{padding:56px 24px;}
  #work{padding:56px 24px;}
  .site-nav{padding:0 20px;}
  .nav-right{gap:6px;}
  .nav-cv{padding:4px 8px;font-size:9px;}
  .nav-cta{padding:5px 10px;font-size:10.5px;}
  .nav-burger{display:flex;}
  .nav-links{
    display:none;position:absolute;top:56px;left:0;right:0;
    flex-direction:column;gap:0;padding:8px 20px 16px;
    background:rgba(10,18,38,.98);backdrop-filter:blur(24px);
    border-bottom:1px solid var(--border2);
  }
  .nav-links.open{display:flex;}
  .nav-links .nav-link{padding:12px 0;border-bottom:1px solid var(--border2);font-size:13px;}
  .nav-links .nav-link:last-child{border-bottom:none;}
  .hero-section{padding:56px 24px 0;}
  .hero-inner{grid-template-columns:1fr;}
  .hero-visual{display:flex;justify-content:center;margin-bottom:24px;}
  .hero-metrics{display:none;}
  .spec-strip{grid-template-columns:1fr 1fr;}
  .about-grid,.contact-grid,.bg-grid{grid-template-columns:1fr;gap:40px;}
  .cases-grid{grid-template-columns:1fr;}
  .cases-grid .cc:last-child:nth-child(3n+1){grid-column:1;}
  .cases-grid:has(.cc:last-child:nth-child(3n+1))::before,
  .cases-grid:has(.cc:last-child:nth-child(3n+1))::after{display:none;}
  .cases-grid .cc:last-child:nth-child(3n+2){grid-column:1;}
  .writing-grid{grid-template-columns:1fr;}
  .prods-grid{grid-template-columns:1fr 1fr;}
  .exp-item{grid-template-columns:1fr;gap:6px;}
  .site-footer{flex-direction:column;gap:6px;text-align:center;padding:16px 24px;}
  .work-tabs{flex-direction:column;}
}
@media(max-width:480px){
  .spec-strip{grid-template-columns:1fr;}
  .prods-grid{grid-template-columns:1fr;}
  .hero-ctas{flex-direction:column;gap:8px;}
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="site-nav" id="nav">
  <a href="/" class="nav-brand">
    <img id="nav-logo" src="/assets/logo.webp" alt="">
    <span class="nav-brand-name">Pablo Montenegro</span>
  </a>
  <div class="nav-links" id="nav-links">
    <a href="consulting.html" class="nav-link active" data-en="Consulting" data-es="Consultoría">Consulting</a>
    <a href="work.html" class="nav-link" data-en="Work" data-es="Trabajo">Work</a>
    <a href="experience.html" class="nav-link" data-en="Experience" data-es="Experiencia">Experience</a>
    <a href="insights.html" class="nav-link" data-en="Insights" data-es="Insights">Insights</a>
    <a href="about.html" class="nav-link" data-en="About" data-es="Sobre mí">About</a>
    <a href="contact.html" class="nav-link" data-en="Contact" data-es="Contacto">Contact</a>
  </div>
  <div class="nav-right">
    <div class="nav-lang">
      <button class="lang-btn active" onclick="setLang('en',this)" id="btn-en">EN</button>
      <button class="lang-btn" onclick="setLang('es',this)" id="btn-es">ES</button>
    </div>
    <a href="/assets/CV_Pablo_Montenegro.pdf" class="nav-cv" target="_blank">↓ CV</a>
    <a href="mailto:hello@pablomontenegro.ie?subject=Let's%20talk" class="nav-cta"
       data-en="Let's talk" data-es="Hablemos">Let's talk</a>
    <button class="nav-burger" id="nav-burger" onclick="toggleMobileNav()" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<main id="main"></main>

<footer class="site-footer">
  <div class="footer-brand">
    <img src="/assets/logo.webp" alt="">
    <span>Pablo Montenegro · Senior Product Leader · Payments &amp; Banking · Dublin</span>
  </div>
  <div style="display:flex;align-items:center;gap:24px;">
    <div class="footer-counter">
      <span class="counter-dot"></span>
      <span id="visit-label" style="font-size:11px;color:var(--muted2);">Visits</span>
      <span class="counter-num" id="visit-count">—</span>
    </div>
    <div class="footer-right">© 2026</div>
  </div>
</footer>

<script src="data.js"></script>
<script src="sections/services.js"></script>
<script src="sections/engagements.js"></script>

<script>
let LANG = localStorage.getItem('pm_lang') || 'en';

function setLang(lang, btn) {
  LANG = lang;
  localStorage.setItem('pm_lang', lang);
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildPage(lang);
  document.documentElement.lang = lang;
}

function toggleMobileNav() {
  const links = document.getElementById('nav-links');
  const burger = document.getElementById('nav-burger');
  const isOpen = links.classList.toggle('open');
  burger.classList.toggle('open', isOpen);
  burger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
}

window.addEventListener('resize', () => {
  if (window.innerWidth > 960) {
    const links = document.getElementById('nav-links');
    const burger = document.getElementById('nav-burger');
    if (links) links.classList.remove('open');
    if (burger) { burger.classList.remove('open'); burger.setAttribute('aria-expanded', 'false'); }
  }
});

function buildPage(lang) {
  const S = window.SECTIONS;
  document.getElementById('main').innerHTML = S.services(lang) + S.engagements(lang);
  initReveal();
}

function switchTab(id, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.classList.remove('active'); p.classList.add('hidden');
  });
  const panel = document.getElementById('tab-' + id);
  if (panel) { panel.classList.remove('hidden'); panel.classList.add('active'); }
  document.querySelectorAll('.work-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function initReveal() {
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }
    });
  }, { threshold: 0.07 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btn-' + LANG).classList.add('active');
  document.getElementById('btn-' + (LANG==='en'?'es':'en')).classList.remove('active');
  document.documentElement.lang = LANG;
  buildPage(LANG);
});

// ─── VISIT COUNTER ─────────────────────────────────
(function() {
  const KEY = 'pablomontenegro-portfolio-visits';
  const el = document.getElementById('visit-count');
  const lbl = document.getElementById('visit-label');
  if (!el) return;
  const local = localStorage.getItem(KEY);
  if (local) el.textContent = parseInt(local).toLocaleString();
  fetch('https://api.countapi.xyz/hit/pablomontenegro.ie/visits')
    .then(r => r.json())
    .then(data => {
      if (data && data.value) {
        const count = data.value;
        el.textContent = count.toLocaleString();
        localStorage.setItem(KEY, count);
        if (lbl) lbl.textContent = count === 1 ? 'Visit' : 'Visits';
      }
    })
    .catch(() => {
      let count = parseInt(localStorage.getItem(KEY + '-local') || '0') + 1;
      localStorage.setItem(KEY + '-local', count);
      el.textContent = count.toLocaleString();
    });
})();
</script>
</body>
